name: Update Kaggle Dataset

on:
  schedule:
    # runs every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # trigger manually from the Actions tab any time

jobs:
  run-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # execute the notebook - timeout is 20 min, the IMF/WB APIs can be slow
      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3 \
            notebook.ipynb
        env:
          PYTHONUNBUFFERED: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # confirm both CSVs landed on disk before we try to upload anything
      - name: Verify outputs exist
        run: |
          for f in sovereign_debt_panel.csv ml_features.csv; do
            if [ -f "$f" ]; then
              echo "OK  $f  ($(wc -l < "$f") lines)"
            else
              echo "MISSING  $f"
              exit 1
            fi
          done

      - name: Configure Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          cat <<EOF2 > ~/.kaggle/kaggle.json
          {"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}
          EOF2
          chmod 600 ~/.kaggle/kaggle.json

      # stage the files Kaggle needs - no README, just the data + metadata
      - name: Stage output files
        run: |
          mkdir -p kaggle_upload
          cp sovereign_debt_panel.csv ml_features.csv dataset-metadata.json kaggle_upload/

      # push a new version if the dataset already exists,
      # or create it fresh on the very first run
      - name: Upload to Kaggle
        run: |
          kaggle datasets version \
            --path kaggle_upload \
            --message "Auto-update $(date -u +%Y-%m-%d)" \
            --dir-mode zip \
          || kaggle datasets create \
            --path kaggle_upload \
            --dir-mode zip
